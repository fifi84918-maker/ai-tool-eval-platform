[project]
name = "ai-tool-eval-platform"
version = "0.0.0"
description = "AI Skill Benchmark 评测与推荐平台（Phase 0 骨架，无业务代码）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "psycopg2-binary>=2.9.0",
]

# uv workspace 根配置。
# 各 Python 模块（collector/core/analyzer/sandbox/scoring/backend）转为独立包时
# 在此登记 members；Phase 0 暂不拆分、不安装依赖。
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
