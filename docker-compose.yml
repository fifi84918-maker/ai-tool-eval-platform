version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skilleval-postgres
    environment:
      POSTGRES_USER: skilleval
      POSTGRES_PASSWORD: skilleval_dev_pass
      POSTGRES_DB: skilleval_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilleval"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for object storage (Phase 2)
  # minio:
  #   image: minio/minio:latest
  #   container_name: skilleval-minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data

volumes:
  postgres_data:
